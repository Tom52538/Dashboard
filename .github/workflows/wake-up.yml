name: Wake Up Dashboard

on:
  schedule:
    # 🧪 TEST-TIMER: Läuft um 06:27, 06:28, 06:29 UTC (08:27, 08:28, 08:29 deutsche Zeit)
    # LÖSCHE DIESE ZEILEN NACH DEM TEST!
    - cron: '27 6 17 10 *'  # 17. Oktober 06:27 UTC (08:27 deutsche Zeit)
    - cron: '28 6 17 10 *'  # 17. Oktober 06:28 UTC (08:28 deutsche Zeit)
    - cron: '29 6 17 10 *'  # 17. Oktober 06:29 UTC (08:29 deutsche Zeit)
    
    # ✅ PRODUKTIV-TIMER (BEHALTEN!)
    # Montag-Freitag um 07:00 Uhr deutsche Sommerzeit (GMT+2 = 05:00 UTC)
    - cron: '0 5 * * 1-5'
    # Mittags um 12:00 Uhr deutsche Sommerzeit (GMT+2 = 10:00 UTC)
    - cron: '0 10 * * 1-5'
    # Nachmittags um 16:30 Uhr deutsche Sommerzeit (GMT+2 = 14:30 UTC)
    - cron: '30 14 * * 1-5'
  
  # Ermöglicht manuelles Triggern über GitHub UI
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Streamlit Dashboard
        run: |
          echo "🔔 Wecke AGRO F66 Dashboard auf..."
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://umsaetze-pro-maschine-dashboard.streamlit.app)
          
          echo "📊 HTTP Response Code: $RESPONSE"
          
          if [ $RESPONSE -eq 200 ] || [ $RESPONSE -eq 302 ] || [ $RESPONSE -eq 303 ]; then
            echo "✅ Dashboard ist wach und antwortet!"
          else
            echo "⚠️ Dashboard antwortet mit ungewöhnlichem Code: $RESPONSE"
            echo "ℹ️ Dies kann normal sein wenn die App gerade startet."
          fi
          
      - name: Zeitstempel
        run: |
          echo "⏰ Workflow ausgeführt um: $(date +'%Y-%m-%d %H:%M:%S UTC')"
          echo "📍 Zeitzone: UTC (Deutschland ist UTC+1/+2)"
          echo "🧪 TEST-MODUS: Prüfe ob App aufwacht!"
